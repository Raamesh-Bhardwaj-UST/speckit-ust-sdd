schema_version: "1.0"

extension:
  id: "ust-sdd-agents"
  name: "UST SDD Custom Agents"
  version: "1.0.0"
  description: "Ships the Architecture Discovery, Spec Generation & Enrichment, and Developer Copilot agents (stack-agnostic) plus a setup command that installs them into .github/agents."
  author: "Raamesh Bhardwaj (UST PACE)"
  repository: "https://github.com/Raamesh-Bhardwaj-UST/speckit-ust-sdd"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"

provides:
  commands:
    - name: "speckit.ust-sdd-agents.setup"
      file: "commands/speckit.ust-sdd-agents.setup.md"
      description: "Install the UST SDD custom agents into .github/agents and seed the architecture context file"

tags:
  - "agents"
  - "copilot"
  - "architecture"
  - "spec"
  - "ust"
